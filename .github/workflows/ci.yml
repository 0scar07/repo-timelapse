name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: CLI smoke test
        run: |
          node bin/cli.mjs --version
          node bin/cli.mjs --demo --json --lang en

  render:
    name: Render a real repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # toda la historia, no solo el último commit
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Timelapse of this repo
        run: node bin/cli.mjs . --lang en -o out/self.mp4
      - name: Vertical demo
        run: node bin/cli.mjs --demo --lang en --vertical --no-music -o out/demo-vertical.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: videos
          path: out/
          retention-days: 7
